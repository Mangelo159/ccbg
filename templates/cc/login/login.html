{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión · Custome Care</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/cc.css' %}">
</head>
<body class="cc-login-body">
    <main class="cc-login-wrap">
        <form class="cc-login-card" method="post">
            {% csrf_token %}
            <div class="cc-brand cc-login-brand">CC</div>
            <div class="cc-hero-eyebrow">Centro de información interna</div>
            <h1 class="cc-login-title">Custome Care</h1>
            <p class="cc-login-sub">Inicia sesión con tu usuario del banco.</p>

            {% if error %}
            <div class="cc-badge cc-login-error">{{ error }}</div>
            {% endif %}

            <label class="cc-login-label" for="username">Usuario</label>
            <input class="cc-login-input" type="text" id="username" name="username" value="{{ username|default:'' }}" autocomplete="username" required autofocus>

            <label class="cc-login-label" for="password">Contraseña</label>
            <input class="cc-login-input" type="password" id="password" name="password" autocomplete="current-password" required>

            <button class="cc-btn cc-btn-primary cc-login-submit" type="submit">Entrar</button>
        </form>
    </main>
</body>
</html>
